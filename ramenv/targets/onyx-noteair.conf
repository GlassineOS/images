# The RAM environment of the Onyx Boox Note Air (docs/ramenv.md): what its init and the
# boot image stage read. Shell syntax, read by the init (/etc/glassine/ramenv.conf) and
# by scripts/ramenv-bootimg.sh.

# The eMMC: its user area and its two boot areas (mmcblk1 on the mainline kernel, so
# any number). RPMB is a character device and never offered.
RAMENV_DISKS="mmcblk[0-9] mmcblk[0-9]boot[0-9]"
# USB: the first controller (the board has one, dwc3 in peripheral mode). It binds late
# on this board (about 30 s into a system boot); the init waits up to RAMENV_UDC_WAIT.
RAMENV_TRANSPORT=usb
RAMENV_UDC=
RAMENV_UDC_WAIT=120
# the qcom watchdog; 30 s is within its range
RAMENV_WATCHDOG=/dev/watchdog0
RAMENV_WATCHDOG_TIMEOUT=30
# the kernel command line: a panic reboots after 5 s; nothing but the initramfs
RAMENV_CMDLINE="panic=5 loglevel=4 rdinit=/init"
# the boot loader's download limit (fastboot max-download-size)
RAMENV_IMAGE_MAX=536870912
