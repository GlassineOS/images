# The RAM environment of the Onyx Boox Note Air (docs/ramenv.md): what its init and the
# boot image stage read. Shell syntax, read by the init (/etc/glassine/ramenv.conf) and
# by scripts/ramenv-bootimg.sh.

# The eMMC: its user area and its two boot areas (mmcblk1 on the mainline kernel, so
# any number). RPMB is a character device and never offered.
RAMENV_DISKS="mmcblk[0-9] mmcblk[0-9]boot[0-9]"
# USB: the first controller (the board has one, dwc3 in peripheral mode). It binds late
# on this board (about 30 s into a system boot); the init waits up to RAMENV_UDC_WAIT.
RAMENV_TRANSPORT=usb
RAMENV_UDC=
RAMENV_UDC_WAIT=120
# the qcom watchdog; 30 s is within its range
RAMENV_WATCHDOG=/dev/watchdog0
RAMENV_WATCHDOG_TIMEOUT=30
# the kernel command line: a panic reboots after 5 s; nothing but the initramfs
RAMENV_CMDLINE="panic=5 loglevel=4 rdinit=/init"
# the boot loader's download limit (fastboot max-download-size; the stock boot loader
# reports 595230720)
RAMENV_IMAGE_MAX=536870912
# the partition the installer writes the image to and the GlassineOS boot loader starts
# it from: recovery, 131072 sectors of 512 bytes in both the stock and the A/B table
RAMENV_RECOVERY_SIZE=67108864

# The recovery (docs/recovery.md): the same image with glassine-deploy, read by its init.
# The partitions glassine-deploy works on, by GPT name (boot's deploy.conf for the
# board: SYSTEM_DEV system_b, USERDATA_DEV userdata); a confirmed DEPLOY may write
# through the file systems on them, nothing else.
RECOVERY_SYSTEM_LABEL=system_b
RECOVERY_USERDATA_LABEL=userdata
RECOVERY_USERDATA_PREFIX=media/glassine
# no request from any client (USB or a menu) for this long: the normal start again
RECOVERY_IDLE=600
RECOVERY_TOOL_LIMIT=900
# the menu on a USB serial function next to the vendor interface; the board has no
# other text console
RECOVERY_USB_SERIAL=yes
RECOVERY_TTYS=ttyGS0
# the screen (docs/recovery.md, "The screen"): the e-ink panel through glassine-epdd,
# the touchscreen and the power key. The panel's adapter (/etc/glassine/epd.conf) is the
# device package's. The panel link, the touchscreen and the power key are built into the
# recovery's kernel (below). The waveform comes from the device data seed on the B
# slot's vendor partition (board.conf DEVICE_PART, which the boot image stage checks this
# against), read without a mount.
RECOVERY_SCREEN=epd
RECOVERY_SCREEN_ADAPTER=device-onyx-noteair
RECOVERY_DEVICE_LABEL=vendor_b
# the recovery's own kernel (docs/recovery.md, "The kernel"): the flavor of
# stages/kernel-<flavor>, everything built in, no modules, no firmware. The RAM
# environment boots the system kernel (the target's kernel=).
RECOVERY_KERNEL=sdm660recovery
