# glassine-deploy on a generic x86-64 UEFI PC (GlassineOS/boot conf/deploy.conf.example
# explains every key): the partitions GlassineOS/installer makes (devices/uefi-pc.toml),
# by their names, the same ones targets/uefi-pc/board.conf gives the initramfs.
SYSTEM_DEV=/dev/disk/by-partlabel/glassine-system
SYSTEM_MNT=/run/glassine/system
USERDATA_DEV=/dev/disk/by-partlabel/glassine-userdata
USERDATA_MNT=/run/glassine/userdata
USERDATA_PREFIX=media/glassine
# nothing to keep at userdata's end: the partition is GlassineOS's own
USERDATA_RESERVE_KIB=0
RUN_DIR=/run/glassine
SWITCH_MIN_CAPACITY=30
ACCEPT_AFTER=120
ACCEPT_HEALTH_DIR=/etc/glassine-bootimg/health.d
SLOT_TOOL=
HIBERNATE_SIZE_MB=
HIBERNATE_RESERVE_MB=512
HIBERNATE_HOOKS=/etc/glassine/hibernate.d
