# Onyx Boox Note Air: fewer wakeups at idle.
# eMMC writeback every 15 s instead of 5 s, dirty pages written after 30 s.
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000
# no perf-based lockup watchdog
kernel.nmi_watchdog = 0
# Energy-aware scheduling off: with the current energy model it moved idle work
# onto the fast cluster and delayed the panel daemon's flip event by about 3 ms,
# with no measurable saving.
kernel.sched_energy_aware = 0
# per-CPU vmstat folding every 10 s instead of 1 s (about 0.8 wakeups a second
# per CPU at idle); only the /proc/vmstat and meminfo counters get staler.
vm.stat_interval = 10
