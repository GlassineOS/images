# Onyx Boox Note Air: the sound card (speaker PCM 0, microphone PCM 1, no jack,
# no UCM profile). PipeWire's generic probe (ACP) calls its output "Headphones"
# and marks it unavailable, so the card starts on the "off" profile and no
# default sink is chosen. Without ACP the PCM is a plain sink.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
  {
    # the DSP front end offers up to 8 channels; the speaker link is stereo
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = {
      update-props = {
        node.description = "Speaker"
        # 16-bit only: opened as S24_LE the speaker stays silent (the stream
        # runs and the amplifier switches, but no sound)
        audio.format = "S16LE"
        audio.channels = 2
        audio.position = "FL,FR"
      }
    }
  }
  {
    # the microphone (capture only): DMIC4 on both channels
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = {
      update-props = {
        node.description = "Microphone"
        audio.channels = 2
        audio.position = "FL,FR"
      }
    }
  }
]
