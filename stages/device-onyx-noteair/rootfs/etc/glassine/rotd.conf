# glassine-rotd on the Onyx Boox Note Air (keys: GlassineOS/shell README)
# the accelerometer on the sensor hub; its IIO number changes when the modules reload
SENSOR=qcom-smgr-accel
OUTPUT=EPD-1
# upright: x reads +g; turned clockwise (the right edge down): y reads -g
AXES=-y x
# 4 samples a second is enough to follow the hand and keeps the wakeups low
RATE_HZ=4
HOLD_MS=500
