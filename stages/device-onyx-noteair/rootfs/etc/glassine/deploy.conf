# glassine-deploy on the Onyx Boox Note Air (keys: GlassineOS/boot docs/deployments.md)
SYSTEM_MNT=/run/glassine/system
USERDATA_MNT=/run/glassine/userdata
RUN_DIR=/run/glassine
# the shutdown switch without a charger: at this battery percent or more (boot's default)
SWITCH_MIN_CAPACITY=30
# a tried deployment is accepted after 2 minutes healthy (checks in ACCEPT_HEALTH_DIR)
ACCEPT_AFTER=120
ACCEPT_HEALTH_DIR=/etc/glassine-bootimg/health.d
# the boot loader keeps both slots marked successful on this device: no slot tool
SLOT_TOOL=
# hibernation: a 1.5 GiB swap file on the user data partition
HIBERNATE_SIZE_MB=1536
HIBERNATE_RESERVE_MB=512
HIBERNATE_HOOKS=/etc/glassine/hibernate.d
