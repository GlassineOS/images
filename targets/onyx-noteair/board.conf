# The boot section of the Onyx Boox Note Air's target description, derived from
# GlassineOS/boot's conf/board.conf.example (which explains every key). The boot image
# stage packs with these header values and nothing else; the packer copies this file
# into the image, where the initramfs and the tools read it. TEST_DEV and HANDOFF are
# empty on purpose: this device has no test slot and no kernel hand-off yet, so
# glassine-kernel install refuses a kernel update here.

# --- Partitions ------------------------------------------------------------
ROOT_PART=system_b
ROOT_FSTYPE=btrfs
ROOT_LAYOUT=deployments
USERDATA_PART=userdata
USERDATA_PREFIX=media/glassine
# device data seed (docs/kernel-artifacts.md): the B slot's vendor partition
DEVICE_PART=vendor_b
DEFAULT_DEV=/dev/disk/by-partlabel/boot_b
TEST_DEV=
TEST_REBOOT_REASON=recovery
PART_SIZE=67108864
# the bootloader's ramdisk limit isn't known: no limit beyond PART_SIZE
RAMDISK_MAX=
# kernel updates: no hand-off on this device yet (install refuses)
HANDOFF=
# the loader record is on the raw boot partition (GPT name glassine-boot, the default
# BOOT_PART): this device's ABL starts the loader from it on slot B, so the accept step
# writes the healthy mark and the shutdown step its one off there (glassine-loader-mark).
# A device without that partition, or with one that holds nothing, gets neither: the
# tool says so and the accept goes on
BOOT_FORM=raw
# the loader draws its splash and start menu through the firmware's panel refresh (its
# extended graphics output, GlassineOS/boot docs/handback.md): the loader update writes
# display=epd-fw into the loader record when it holds another value; a sticky
# display_failed stays until the person's glassine-loader-mark display-retry
LOADER_DISPLAY=epd-fw
# the loader's own touch driver is the start menu's tap source (touch=on, written into
# the loader record by the loader update when touch is empty; a person's probe or off
# stays)
LOADER_TOUCH=on
# this device's ABL passes no command line to the kernel it boots (it ignores the
# loader's cmdline_add) and boots no kernel set but boot_b: a deployment picked in the
# start menu goes through the loader record (deploy_once, taken and cleared by the
# initramfs), and the menu offers no "Previous kernel" (GlassineOS/boot docs/handback.md)
LOADER_PARENT_CMDLINE=no
LOADER_PARENT_SETS=no
# the start menu's Android entry (other=android in the loader record): offered only
# once the ABL announces other:android (v3.4-android-once, not flashed; v3.3-handback
# doesn't), so it stays hidden until then
LOADER_OTHER=android
# the device name of this board's device trees (boot/dtb/<device>@<id>)
DEVICE=onyx-noteair

# --- Roles -----------------------------------------------------------------
DEFAULT_ROLE_MATCH='[s_]kip_initramfs'

# --- Developer mode (glassine.devmode=usb) ---------------------------------
DEVMODE_ADDR=172.16.42.1
DEVMODE_NETMASK=255.255.255.0
DEVMODE_DHCP_START=172.16.42.2
DEVMODE_DHCP_END=172.16.42.10

# --- Boot image ------------------------------------------------------------
CMDLINE="panic=5 loglevel=7 mitigations=off rdinit=/init glassine.return=180"
PAGE_SIZE=4096
KERNEL_ADDR=0x00008000
RAMDISK_ADDR=0x01000000
SECOND_ADDR=0x00000000
TAGS_ADDR=0x00000100
OS_VERSION=0x1800063c
NAME=glassine
