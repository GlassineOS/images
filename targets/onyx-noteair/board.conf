# The boot section of the Onyx Boox Note Air's target description: GlassineOS/boot's
# board.conf (conf/board.conf.example explains every key), verbatim. The boot image
# stage packs with these header values and nothing else; the packer copies this file
# into the image, where the initramfs and the tools read it.

# --- Partitions ------------------------------------------------------------
ROOT_PART=system_b
ROOT_FSTYPE=btrfs
ROOT_LAYOUT=deployments
USERDATA_PART=userdata
USERDATA_PREFIX=media/glassine
# device data seed (docs/kernel-artifacts.md): the B slot's vendor partition
DEVICE_PART=vendor_b
DEFAULT_DEV=/dev/disk/by-partlabel/boot_b
TEST_DEV=
TEST_REBOOT_REASON=recovery
PART_SIZE=67108864
# the bootloader's ramdisk limit isn't known: no limit beyond PART_SIZE
RAMDISK_MAX=
# kernel updates: no hand-off on this device yet (install refuses)
HANDOFF=
# the device name of this board's device trees (boot/dtb/<device>@<id>)
DEVICE=onyx-noteair

# --- Roles -----------------------------------------------------------------
DEFAULT_ROLE_MATCH='[s_]kip_initramfs'

# --- Developer mode (glassine.devmode=usb) ---------------------------------
DEVMODE_ADDR=172.16.42.1
DEVMODE_NETMASK=255.255.255.0
DEVMODE_DHCP_START=172.16.42.2
DEVMODE_DHCP_END=172.16.42.10

# --- Boot image ------------------------------------------------------------
CMDLINE="panic=5 loglevel=7 mitigations=off rdinit=/init glassine.return=180"
PAGE_SIZE=4096
KERNEL_ADDR=0x00008000
RAMDISK_ADDR=0x01000000
SECOND_ADDR=0x00000000
TAGS_ADDR=0x00000100
OS_VERSION=0x1800063c
NAME=glassine
