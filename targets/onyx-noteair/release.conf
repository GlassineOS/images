# What a release of the Onyx Boox Note Air takes from other repositories
# (scripts/pool-image, docs/artifacts.md "Releases"): per role the file's URL, pinned
# by its SHA-256. pool-image fetches each one, or takes the file given with
# --boot-loader / --layout, and refuses bytes that aren't these.

# boot-loader: the GlassineOS ABL, the release asset of GlassineOS/abl's tag
# LA.UM.7.2.c25-12600-sdm660.0-glassine1 (rebuilt there byte for byte from the tag,
# GLASSINE.md "Reproducing the flashed build"). Its partition, abl, is 1 MiB on the
# Note Air (the stock partition table; the installer's description names abl without
# its size).
BOOT_LOADER_URL=https://github.com/GlassineOS/abl/releases/download/LA.UM.7.2.c25-12600-sdm660.0-glassine1/abl.elf
BOOT_LOADER_SHA256=348be699ae2b5c58a4953e003cc8b2e0b7cc3601375aadadfb9676b4c3092183
BOOT_LOADER_PART_SIZE=1048576

# partition-layout: the A/B layout recipe (kind gpt-recipe) from GlassineOS/installer's
# layouts/, which the installer's tests hold against the device description and the
# lab's A/B table.
LAYOUT_URL=https://raw.githubusercontent.com/GlassineOS/installer/3df939d408ba8e265da46f84ef2860d4c2304039/layouts/onyx-noteair.json
LAYOUT_SHA256=535e17535bc46ec3556f3640cc6318a52230ce718bbd3a05ae874c90c0a64c37
