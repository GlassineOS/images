# The boot section of the generic x86-64 UEFI PC's target description, from
# GlassineOS/boot's conf/board.conf.example (which explains every key). A PC has no boot
# image: the installer and the running system put a kernel set together (boot's
# docs/boot-partition.md) with this file as its board archive, and the set's base
# command line is its CMDLINE and nothing else. The base carries the same file as
# /etc/glassine-bootimg/board.conf, and a PC release names it as its `board` role
# (scripts/pool-image).
#
# The partitions are the installer's (GlassineOS/installer devices/uefi-pc.toml). A
# kernel set's command line also names the system and data partitions by their GPT
# identity (glassine.system=, glassine.userdata=), which the initramfs uses (these names
# remain its fallback). HANDOFF=uefi: a new kernel goes as a kernel set on the boot
# partition (BOOT_PART, default glassine-boot, on the system partition's disk), with
# this file's CMDLINE as its base command line (boot's glassine-bootimg; its
# build-boot-modules.sh needs kmod and cpio, in device-uefi-pc).

# --- Partitions ------------------------------------------------------------
ROOT_PART=glassine-system
ROOT_FSTYPE=btrfs
ROOT_LAYOUT=deployments
USERDATA_PART=glassine-userdata
USERDATA_PREFIX=media/glassine
DEVICE_PART=
DEFAULT_DEV=
TEST_DEV=
HANDOFF=uefi
DEVICE=

# --- Roles -----------------------------------------------------------------
# a PC's loader marks neither role: every start is a default start
DEFAULT_ROLE_MATCH=''

# --- Developer mode (glassine.devmode=usb) ---------------------------------
DEVMODE_ADDR=172.16.42.1
DEVMODE_NETMASK=255.255.255.0
DEVMODE_DHCP_START=172.16.42.2
DEVMODE_DHCP_END=172.16.42.10

# --- Kernel set ------------------------------------------------------------
CMDLINE="panic=10 loglevel=4"
