# What a release of the generic x86-64 UEFI PC takes from elsewhere or makes by rule
# (scripts/pool-image, docs/artifacts.md "Releases").

# boot-loader: GlassineOS/loader's EFI application, for \EFI\glassine\loader.efi and
# the removable-media path: the x86-64 asset of its release v0.1.1 (a prerelease, built
# twice and matched byte for byte by its release workflow, tested in QEMU/OVMF only).
# A new loader is a new release there and a pull request here changing both lines.
BOOT_LOADER_URL=https://github.com/GlassineOS/loader/releases/download/v0.1.1/glassine-loader-x86_64.efi
BOOT_LOADER_SHA256=490c68ce47969a4cb51b56492d383e6221d975ea8d68b9f2e672ed3e0af12029

# splash: the default splash (boot's docs/boot-partition.md, "The image format",
# format 2), a plain picture of one colour made by pool-image: SPLASH_WIDTH x
# SPLASH_HEIGHT pixels of SPLASH_COLOR (0xRRGGBB) in the pixel layout SPLASH_LAYOUT
# (grey8 for a grey panel; a PC's displays take colour), made for a display mode of that
# size, on the same background, so the loader scales it to fill any screen of that
# aspect ratio.
SPLASH_WIDTH=1920
SPLASH_HEIGHT=1080
SPLASH_COLOR=0xf4f2ec
SPLASH_LAYOUT=rgb888
