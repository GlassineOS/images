# Host tests of the build command, the registry side and materialization, without a
# stage build: scripts/test-build.sh (a stand-in docker, local git fixtures; also local
# checkouts and scripts/promote), scripts/test-registry.sh (the keys,
# scripts/git-fetch.sh, and a registry:2 container with a docker-container builder) and
# scripts/test-materialize.sh (privileged containers with loop devices and btrfs on a
# tmpfs, and one BuildKit tar export of a fixture tree) and scripts/test-pool-image.sh (the
# installer's release folder, the pool image and a delta received into it) and
# scripts/test-apk-stage.sh (a stage's locked install, in an Alpine container on a
# made-up repository) and scripts/test-kernel-lock.sh (a distribution kernel's firmware
# held with it by the lock refresh, and one release, one tree) and
# scripts/test-keep-updates.sh (KEEP_UPDATES derived from made-up device descriptions).
name: host-tests
on:
  pull_request:
    paths:
      - scripts/build
      - scripts/promote
      - scripts/materialize
      - scripts/materialize-container.sh
      - scripts/glassine_pins.py
      - scripts/tree-manifest.py
      - scripts/base_tree.py
      - scripts/test-build.sh
      - scripts/test-materialize.sh
      - scripts/pool-image
      - scripts/pool-image-container.sh
      - scripts/test-pool-image.sh
      - scripts/test-registry.sh
      - scripts/glassine_registry.py
      - scripts/registry
      - scripts/git-fetch.sh
      - scripts/kernel-check
      - scripts/apk-stage.sh
      - scripts/test-apk-stage.sh
      - scripts/lock.sh
      - scripts/lock-diff.sh
      - scripts/kernel-lock.sh
      - scripts/kernel-release-check
      - scripts/test-kernel-lock.sh
      - scripts/keep-updates.sh
      - scripts/test-keep-updates.sh
      - Dockerfile
      - targets/**
      - .github/workflows/host-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/build
      - scripts/promote
      - scripts/materialize
      - scripts/materialize-container.sh
      - scripts/glassine_pins.py
      - scripts/tree-manifest.py
      - scripts/base_tree.py
      - scripts/test-build.sh
      - scripts/test-materialize.sh
      - scripts/pool-image
      - scripts/pool-image-container.sh
      - scripts/test-pool-image.sh
      - scripts/test-registry.sh
      - scripts/glassine_registry.py
      - scripts/registry
      - scripts/git-fetch.sh
      - scripts/kernel-check
      - scripts/apk-stage.sh
      - scripts/test-apk-stage.sh
      - scripts/lock.sh
      - scripts/lock-diff.sh
      - scripts/kernel-lock.sh
      - scripts/kernel-release-check
      - scripts/test-kernel-lock.sh
      - scripts/keep-updates.sh
      - scripts/test-keep-updates.sh
      - Dockerfile
      - targets/**
      - .github/workflows/host-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/test-build.sh
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/test-registry.sh
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # materialization mounts btrfs on loop devices; the runner doesn't load the module
      - run: sudo modprobe btrfs
      - run: sh scripts/test-materialize.sh
  pool-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo modprobe btrfs
      - run: sh scripts/test-pool-image.sh
  apk-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/test-apk-stage.sh
  kernel-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/test-kernel-lock.sh
  keep-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/test-keep-updates.sh
