# Refreshes the stage locks every day on a native arm64 runner (scripts/lock.sh) and
# opens or updates one pull request with what changed: on Mondays for any change, on
# any day when a change brings a fix listed in Alpine's security database.
name: lock-refresh
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      open:
        description: Open the pull request for any change, not only a security fix
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: lock-refresh

jobs:
  refresh:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Refresh the locks
        run: |
          mkdir -p /tmp/locks/old /tmp/locks/new
          # stages without a package lock (the kernel's) are skipped
          for d in stages/*/; do if [ -f "$d/lock" ]; then cp "$d/lock" "/tmp/locks/old/$(basename "$d")"; fi; done
          scripts/lock.sh
          for d in stages/*/; do if [ -f "$d/lock" ]; then cp "$d/lock" "/tmp/locks/new/$(basename "$d")"; fi; done
      - name: What changed
        run: |
          docker run --rm -v /tmp/locks:/l -v "$PWD/scripts:/s:ro" alpine:3.24 \
            sh -c 'apk add -q jq && sh /s/lock-diff.sh /l/old /l/new /l/kind' > /tmp/locks/body.md
          cat /tmp/locks/body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN: ${{ github.event_name == 'workflow_dispatch' && inputs.open }}
        run: |
          if git diff --quiet -- stages; then echo "locks unchanged"; exit 0; fi
          kind=$(cat /tmp/locks/kind)
          if [ "$kind" != security ] && [ "$(date -u +%u)" != 1 ] && [ "$OPEN" != true ]; then
            echo "routine changes only: the pull request waits for Monday"; exit 0
          fi
          title="Locks: refresh"
          [ "$kind" = security ] && title="Locks: refresh with security fixes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C lock-refresh
          git add stages
          git commit -q -m "$title" -m "Generated by the lock-refresh workflow (scripts/lock.sh)."
          git push -f origin lock-refresh
          if [ "$(gh pr view lock-refresh --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit lock-refresh --title "$title" --body-file /tmp/locks/body.md
          else
            gh pr create --head lock-refresh --base main --title "$title" --body-file /tmp/locks/body.md
          fi
          # a push with this token starts no workflow, so the build is started by hand
          gh workflow run build.yml --ref lock-refresh
