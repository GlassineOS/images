# The acceptance test of specs/002-base-boot-acceptance (scripts/test-boot-qemu.sh): the
# generic reference base, a second base as a delta, and two defective bases, each booted
# in QEMU (arm64 virt) with GlassineOS/boot's harness at the pinned BOOT_COMMIT. On a
# native arm64 runner, so only the guest is emulated. Runs when anything a base's build
# reads changes (the Dockerfile, the stages and their locks, the targets, the keys, the
# scripts: these hold the materialization and the test too), weekly, and by hand.
# The first-start job (scripts/test-first-start-qemu.sh): a release made by pool-image
# written to a virtual system_b beside another system's userdata and booted bare: the
# first start grows the pool, formats userdata and selects the first deployment, which
# boots and is accepted.
# The pc-release job: the generic x86-64 UEFI PC's release folder (scripts/pc-release,
# the kernel from the registry), installed by GlassineOS/installer (the commit in
# scripts/test-pc-release-qemu.installer) on a blank virtual PC and started from its disk
# through the firmware's entry and the loader into the first deployment
# (scripts/test-pc-release-qemu.sh). On main the folder is kept as the run's artifact
# uefi-pc-release, which the pc-release-publish job publishes as the GitHub Release
# uefi-pc-<base-id> (scripts/pc-release-publish; the newest 3 kept). The same job makes
# the installer drive from that folder (scripts/installer-drive, specs/004) and tests it
# (scripts/test-installer-drive-qemu.sh: the drive's session installs on a blank virtual
# PC, which then starts from that disk alone); the drive is published with the release.
# The x86_64 job (scripts/test-boot-qemu-x86_64.sh): the generic x86-64 UEFI PC's base,
# Alpine's linux-lts and the initramfs built for x86-64, booted under UEFI firmware
# (OVMF, the kernel's EFI stub) in qemu-system-x86_64 with KVM, through the same
# deployment lifecycle.
name: boot-qemu
on:
  pull_request:
    paths: [Dockerfile, stages/**, targets/**, keys/**, scripts/**, drive/**, .github/workflows/boot-qemu.yml]
  push:
    branches: [main]
    paths: [Dockerfile, stages/**, targets/**, keys/**, scripts/**, drive/**, .github/workflows/boot-qemu.yml]
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boot-qemu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boot-qemu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # materialization and the harness's disk step mount btrfs on loop devices
      - run: sudo modprobe btrfs
      - name: the base boots as a deployment; the defective bases fail
        run: sh scripts/test-boot-qemu.sh
      - name: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-qemu-logs
          path: |
            .out/test-boot-qemu/*.log
            .out/test-boot-qemu/run-*/*.log
          if-no-files-found: ignore
  first-start:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: sudo modprobe btrfs
      - name: a release's pool image boots bare; the first start makes the first deployment
        run: sh scripts/test-first-start-qemu.sh
      - name: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-start-qemu-logs
          path: .out/test-first-start-qemu/*.log
          if-no-files-found: ignore
  boot-qemu-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: sudo modprobe btrfs
      # KVM for the guest: the runner has /dev/kvm, readable only by its group
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: the x86-64 base boots as a deployment under UEFI
        run: sh scripts/test-boot-qemu-x86_64.sh
      - name: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-qemu-x86_64-logs
          path: .out/test-boot-qemu-x86_64/*.log
          if-no-files-found: ignore
  pc-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # pool-image and the disk checks mount btrfs on loop devices
      - run: sudo modprobe btrfs
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: the PC's release folder
        run: scripts/pc-release --artifacts "$RUNNER_TEMP/artifacts" --no-parent --out "$RUNNER_TEMP/uefi-pc-release"
      - name: the installer installs it on a blank virtual PC, which starts it
        run: sh scripts/test-pc-release-qemu.sh "$RUNNER_TEMP/uefi-pc-release"
      # the installer the release test built (the same pinned commit), not built again
      - name: the installer drive made from that folder
        env:
          INSTALLER_CHECKOUT: .out/test-pc-release-qemu/installer
        run: scripts/installer-drive --out "$RUNNER_TEMP/installer-drive" "$RUNNER_TEMP/uefi-pc-release"
      - name: the drive's session installs on a blank virtual PC, which starts it
        env:
          INSTALLER_CHECKOUT: .out/test-pc-release-qemu/installer
        run: sh scripts/test-installer-drive-qemu.sh --drive "$(ls "$RUNNER_TEMP"/installer-drive/glassine-drive-*.img)"
      - name: the drive compressed, for the publish job (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          zstd -q -T0 -10 --rm "$RUNNER_TEMP"/installer-drive/glassine-drive-*.img
          ls -l "$RUNNER_TEMP/installer-drive"
      - name: the drive, for the publish job (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: installer-drive
          path: ${{ runner.temp }}/installer-drive
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: the release folder, for the publish job (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: uefi-pc-release
          path: ${{ runner.temp }}/uefi-pc-release
          retention-days: 2
          if-no-files-found: error
      - name: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-release-logs
          path: |
            .out/test-pc-release-qemu/*.log
            .out/test-pc-release-qemu/*.json
            .out/test-installer-drive-qemu/*.log
            .out/installer-drive/*.log
          if-no-files-found: ignore
  # The tested folder as a GitHub Release uefi-pc-<base-id> (scripts/pc-release-publish,
  # docs/artifacts.md "Published PC releases"): the only job with write access.
  pc-release-publish:
    needs: pc-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pc-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: uefi-pc-release
          path: ${{ runner.temp }}/uefi-pc-release
      - uses: actions/download-artifact@v8
        with:
          name: installer-drive
          path: ${{ runner.temp }}/installer-drive
      - name: publish (the newest 3 kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pc-release-publish "$RUNNER_TEMP/uefi-pc-release" --drive "$RUNNER_TEMP/installer-drive" --keep 3
